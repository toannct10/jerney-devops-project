# ==============================================================
# Jerney - DevSecOps CI/CD Pipeline (Simplified for Fresher/Junior)
# ==============================================================
# Triggers:
# - Pull Request to main: Test (Lint + Audit) & Build/Scan image (dry-run)
# - Push to main: Test, Build & Scan, Push to GHCR, Update K8s Manifest
# ==============================================================

name: Jerney CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # Cho phép bot commit update tag image vào k8s/jerney.yaml
  packages: write # Cho phép push Docker image lên GitHub Container Registry (GHCR)

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/jerney-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/jerney-frontend

jobs:
  # ==============================================================
  # JOB 1: Test & Code Quality (Linting + Dependency Audit)
  # ==============================================================
  ci-test:
    name: "🧪 Test & Audit (${{ matrix.component }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run Linter (ESLint)
        working-directory: ${{ matrix.component }}
        run: npm run lint

      - name: Audit Dependencies (SCA)
        working-directory: ${{ matrix.component }}
        # Quét lỗ hổng các package npm (không fail với moderate)
        run: npm audit --audit-level=high || true

  # ==============================================================
  # JOB 2: Build, Scan & Push Container Images
  # ==============================================================
  build-scan-push:
    name: "🐳 Build, Scan & Push (${{ matrix.component }})"
    runs-on: ubuntu-latest
    needs: ci-test
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Bước 1: Build image nạp vào local Docker daemon để Trivy quét
      - name: Build local image for security scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          load: true
          tags: jerney-${{ matrix.component }}:scan
          cache-from: type=gha

      # Bước 2: Quét lỗ hổng bảo mật bằng Trivy
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "jerney-${{ matrix.component }}:scan"
          format: "table"
          exit-code: "0" # Ghi nhận kết quả mà không làm gãy pipeline dev
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # Bước 3: Đẩy image lên GHCR (Chỉ chạy khi push vào nhánh main)
      - name: Push Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================
  # JOB 3: Update Kubernetes Manifest
  # Tự động cập nhật image tag mới nhất vào k8s/jerney.yaml
  # ==============================================================
  update-manifest:
    name: "🚀 Update K8s Manifest"
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short Git Commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update image tag in k8s/jerney.yaml
        run: |
          IMAGE_TAG=${{ steps.sha.outputs.short }}
          echo "Updating Kubernetes manifests with new tag: ${IMAGE_TAG}"

          # Cập nhật tag image an toàn và ngắn gọn
          sed -i -E "s|(image:.*jerney-backend:).*|\1${IMAGE_TAG}|" k8s/jerney.yaml
          sed -i -E "s|(image:.*jerney-frontend:).*|\1${IMAGE_TAG}|" k8s/jerney.yaml

          echo "✅ Verified updated images in manifest:"
          grep -E "image:.*jerney-(backend|frontend):" k8s/jerney.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/jerney.yaml
          git diff --cached --quiet || git commit -m "ci: update k8s images to tag ${{ steps.sha.outputs.short }} [skip ci]"
          git push
